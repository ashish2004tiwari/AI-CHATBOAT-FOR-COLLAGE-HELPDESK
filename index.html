<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Helpdesk Chatbot</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f0f2f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:white;
    border-radius:15px;
    box-shadow:0px 0px 15px rgba(0,0,0,.2);
    overflow:hidden;
}

.header{
    background:#1565c0;
    color:white;
    text-align:center;
    padding:15px;
}

.header h2{
    margin-bottom:5px;
}

#chatbox{
    height:420px;
    overflow-y:auto;
    padding:15px;
    background:#fafafa;
}

.user{
    text-align:right;
    margin:10px 0;
}

.user span{
    background:#1565c0;
    color:white;
    padding:10px 14px;
    border-radius:15px;
    display:inline-block;
}

.bot{
    text-align:left;
    margin:10px 0;
}

.bot span{
    background:#e4e6eb;
    color:black;
    padding:10px 14px;
    border-radius:15px;
    display:inline-block;
}

.footer{
    display:flex;
    padding:10px;
    background:white;
}

.footer input{
    flex:1;
    padding:10px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:8px;
}

.footer button{
    margin-left:5px;
    padding:10px 14px;
    border:none;
    background:#1565c0;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.footer button:hover{
    background:#0d47a1;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h2>🎓 College Helpdesk Chatbot</h2>
<p>Ask anything about the college</p>
</div>

<div id="chatbox">

<div class="bot">
<span>Hello 👋 Welcome to College Helpdesk Chatbot.</span>
</div>

</div>

<div class="footer">

<input
type="text"
id="msg"
placeholder="Type your question..."
onkeypress="if(event.key==='Enter') sendMsg();">

<button onclick="sendMsg()">Send</button>

<button onclick="startVoice()">🎤</button>

</div>

</div>

<script>

async function sendMsg(){

let input=document.getElementById("msg");

let message=input.value.trim();

if(message=="") return;

let chat=document.getElementById("chatbox");

// User Message
chat.innerHTML+=`
<div class="user">
<span>${message}</span>
</div>
`;

chat.scrollTop=chat.scrollHeight;

input.value="";

try{

let response=await fetch("http://localhost:3000/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:message
})

});

let data=await response.json();

// Bot Reply
chat.innerHTML+=`
<div class="bot">
<span>${data.reply}</span>
</div>
`;

chat.scrollTop=chat.scrollHeight;

// Voice Reply
let speech=new SpeechSynthesisUtterance(data.reply);
speech.lang="en-IN";
window.speechSynthesis.speak(speech);

}
catch(error){

chat.innerHTML+=`
<div class="bot">
<span>Server is not running. Please start backend.</span>
</div>
`;

}

chat.scrollTop=chat.scrollHeight;

}

// Voice Input

function startVoice(){

if(!('webkitSpeechRecognition' in window)){

alert("Voice Recognition is not supported in this browser.");

return;

}

const recognition=new webkitSpeechRecognition();

recognition.lang="en-IN";

recognition.start();

recognition.onresult=function(event){

let text=event.results[0][0].transcript;

document.getElementById("msg").value=text;

sendMsg();

}

}

</script>

</body>
</html>
